<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>检查器</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/wo-checker/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">检查器</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          新类别
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">类别</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="更多">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="clearDoneBtn">
              <span class="material-symbols-outlined" slot="icon">playlist_remove</span>
              清除已完成
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="备忘录。自动保存。"></textarea>
        </section>

        <section class="tasks-panel">
          <div class="tasks-head">
            <div class="tasks-head-title"><strong>任务</strong><span id="taskCount">0 项</span></div>
          </div>
          <div class="add-task-row">
            <md-outlined-text-field id="quickAddField" label="新任务" required></md-outlined-text-field>
            <md-filled-button id="quickAddBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              添加
            </md-filled-button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">编辑</md-menu-item>
    <md-menu-item id="menuDelete">删除</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">编辑名称</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">删除群组</md-menu-item>
  </md-menu>

  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">删除群组</div>
    <div slot="content" class="dialog-body">
      <p>是否要删除此群组？此操作无法撤回。</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">取消</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">删除</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="taskDialog">
    <div slot="headline" id="taskDialogTitle">添加任务</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="taskTextField" label="任务名称" supporting-text="显示在待办清单上的项目" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="taskCancelBtn">取消</md-text-button>
      <md-filled-button id="taskSaveBtn">保存</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">新类别</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="标题" supporting-text="例：工作、购物、旅行" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">取消</md-text-button>
      <md-filled-button id="workspaceSaveBtn">添加</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/wo-checker/app.js"></script>
   <script src="https://nidele206.github.io/check.js?check=none"></script>
</body>
</html>
