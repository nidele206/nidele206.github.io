<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Files Taco - 在 Google Drive 中按项目管理和共享文件、Docs、Sheets、Slides、Forms、笔记和网页链接。">
  <meta name="color-scheme" content="light dark">
  <title>Files Taco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://esm.run" crossorigin>
  <link rel="stylesheet" href="../src/files-taco/style.css">
</head>
<body>
  <div class="ft-app-shell">
<div class="ft-content-shell">
      <header class="ft-topbar">
        <a class="ft-brand" href="./" aria-label="Files Taco 首页">
          <img class="ft-brand-icon" src="../src/files-taco/icon.svg" alt="" width="36" height="36">
          <span class="ft-brand-name">Files Taco</span>
        </a>
        <div class="ft-topbar-actions">
          <span id="ft-auth-status" class="ft-account-label" aria-live="polite"></span>
          <md-outlined-button id="ft-drive-connect-button" class="is-hidden">连接 Drive</md-outlined-button>
          <md-text-button id="ft-logout-button" class="is-hidden">解除连接</md-text-button>
        </div>
      </header>

    <div id="ft-busy-overlay" class="ft-busy-overlay" aria-hidden="true">
      <div class="ft-busy-card" role="status" aria-live="polite" aria-label="处理中">
        <div id="ft-busy-label" class="ft-busy-label">处理中…</div>
        <md-linear-progress indeterminate aria-label="处理中"></md-linear-progress>
      </div>
    </div>

    <main class="ft-main">
      <section id="ft-home-view" class="ft-view" aria-labelledby="ft-home-title">
        <div class="ft-home-layout">
          <div class="ft-home-copy">
            <h1 id="ft-home-title">文件，统整于一个项目。</h1>
            <p class="ft-home-lead">以您的 Google Drive 实际文件为中心，将 Docs、Sheets、Slides、Forms、笔记和网页链接整理到一个项目中。</p>
            <div class="ft-home-actions">
              <md-filled-button id="ft-home-login-button">连接 Google Drive</md-filled-button>
            </div>
          </div>
        </div>
      </section>

      <section id="ft-dashboard-view" class="ft-view is-hidden" aria-labelledby="ft-dashboard-title">
        <div class="ft-page-header">
          <div>
            <h1 id="ft-dashboard-title">项目</h1>
          </div>
        </div>

        <div class="ft-dashboard-toolbar">
          <md-filled-button id="ft-create-project-button" has-icon>
            <md-icon slot="icon">add</md-icon>
            新增项目
          </md-filled-button>
        </div>

        <div id="ft-project-list" class="ft-project-grid" aria-live="polite"></div>
      </section>

      <section id="ft-project-manager-view" class="ft-view is-hidden" aria-labelledby="ft-manager-title">
        <div id="ft-manager-content"></div>
      </section>

      <section id="ft-public-view" class="ft-view is-hidden" aria-labelledby="ft-public-title">
        <div id="ft-public-project"></div>
      </section>
    </main>

    <div id="ft-snackbar" class="ft-snackbar" role="status" aria-live="polite" aria-atomic="true">
      <span class="ft-snackbar-icon material-symbols-rounded" data-snackbar-icon aria-hidden="true">check_circle</span>
      <span id="ft-snackbar-message" class="ft-snackbar-message"></span>
    </div>

    <md-dialog id="ft-name-dialog">
      <div slot="headline" id="ft-name-dialog-title">重命名</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-name-dialog-input" label="名称" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-name-dialog-cancel">取消</md-text-button>
        <md-filled-button id="ft-name-dialog-confirm">变更</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-delete-dialog" type="alert">
      <div slot="headline">要删除吗？</div>
      <div slot="content" id="ft-delete-dialog-content" class="ft-dialog-text"></div>
      <div slot="actions">
        <md-text-button id="ft-delete-dialog-cancel">取消</md-text-button>
        <md-filled-button id="ft-delete-dialog-confirm">删除</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-project-create-dialog">
      <div slot="headline">新增项目</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-project-create-name" label="项目名称" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-project-create-cancel">取消</md-text-button>
        <md-filled-button id="ft-project-create-confirm">创建</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-create-dialog">
      <div slot="headline" id="ft-create-dialog-title">新增</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-create-dialog-name" label="名称" required></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-url" label="URL" type="url" class="is-hidden"></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-content-input" label="笔记" type="textarea" rows="6" class="is-hidden"></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-create-dialog-cancel">取消</md-text-button>
        <md-filled-button id="ft-create-dialog-confirm">新增</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>共用项目</span>
        <md-icon-button id="ft-share-close-button" aria-label="关闭"><md-icon>close</md-icon></md-icon-button>
      </div>
      <div slot="content" class="ft-share-content">
        <div class="ft-share-entry">
          <md-outlined-text-field id="ft-share-email" label="Google 账户" type="email" placeholder="example@gmail.com"></md-outlined-text-field>
          <md-filled-button id="ft-share-add-button">共用</md-filled-button>
        </div>
        <div id="ft-share-list" class="ft-share-list"></div>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-link-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>共用链接</span>
        <md-icon-button id="ft-share-link-close-button" aria-label="关闭">
          <md-icon>close</md-icon>
        </md-icon-button>
      </div>
      <div slot="content" class="ft-dialog-content ft-share-link-content">
        <md-outlined-text-field id="ft-share-link-input" label="共用链接" type="url" readonly></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-share-link-copy-button">复制</md-text-button>
      </div>
    </md-dialog>
    </div>
  </div>
