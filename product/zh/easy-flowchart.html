<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>简易流程图 — 基于Mermaid的流程图编辑器</title>
<meta name="description" content="支持Mermaid的浏览器端流程图编辑器。以标签页方式打开Welcome和项目，并可直接编辑项目。">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1a73e8">
<link rel="canonical" href="./">
<meta property="og:type" content="website">
<meta property="og:title" content="简易流程图 — 基于Mermaid的流程图编辑器">
<meta property="og:description" content="以标签页方式打开Welcome和项目，能直观编辑节点和箭头的Mermaid基础流程图编辑器。">
<meta property="og:image" content="icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="简易流程图 — 基于Mermaid的流程图编辑器">
<meta name="twitter:description" content="可在浏览器中使用的Mermaid基础流程图编辑器。">
<link rel="icon" type="image/png" href="../src/easy-flowchart/icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"简易流程图","applicationCategory":"DesignApplication","operatingSystem":"Web Browser","description":"支持Mermaid的浏览器端流程图编辑器。","url":"./"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/easy-flowchart/style.css">
</head>
<body>
<div class="app">
  <header class="topbar workspace-tabs-bar">
    <div id="topTabs" class="top-tabs" role="tablist" aria-label="打开的标签页"></div>
    <button id="newTopTabBtn" class="new-top-tab" type="button" title="新标签页" aria-label="新标签页">
      <span class="material-icons-round">add</span>
    </button>
  </header>

  <!-- Welcome本身即为最上层标签页的内容。从这里打开项目会将当前的Welcome标签页改为项目标签页。 -->
  <main id="welcomeView" class="welcome-view" hidden>
    <section class="welcome-shell">
      <img class="welcome-logo" src="../src/easy-flowchart/icon.png" alt="简易流程图" width="96" height="96">
      <div class="welcome-eyebrow">Nidele Series</div>
      <h1>简易流程图</h1>
      <p>从「新建项目」开始</p>
      <button id="createProjectBtn" class="primary welcome-create" type="button">
        <span class="material-icons-round">add</span>新建项目
      </button>
    </section>
    <section class="project-section" aria-labelledby="projectSectionTitle">
      <div class="project-section-head">
        <div>
          <h2 id="projectSectionTitle">项目</h2>
        </div>
      </div>
      <div id="projectGrid" class="project-grid"></div>
      <div id="projectEmpty" class="project-empty" hidden>
        <span class="material-icons-round">folder_open</span>
        <strong>目前没有项目</strong>
        <p>可以从「新建项目」创建。</p>
      </div>
    </section>
  </main>

  <!-- 项目标签页的内容。项目是一个编辑文档，内部不包含文件标签页。 -->
  <section id="editorView" class="editor-view" hidden>
    <header class="topbar project-toolbar">
      <div id="status" class="status">准备中...</div>
      <div class="top-actions">
        <button class="icon-btn" id="renameBtn" title="改名" aria-label="改名"><span class="material-icons-round">edit</span>改名</button>
        <button class="icon-btn" id="undoBtn" title="撤销" aria-label="撤销"><span class="material-icons-round">undo</span></button>
        <button class="icon-btn" id="redoBtn" title="重做" aria-label="重做"><span class="material-icons-round">redo</span></button>
        <button class="icon-btn" id="previewBtn" title="Mermaid预览" aria-label="Mermaid预览"><span class="material-icons-round">play_arrow</span>SVG 预览</button>
        <button class="icon-btn" id="exportBtn" title="输出SVG" aria-label="输出SVG"><span class="material-icons-round">download</span>下载</button>
        <button class="icon-btn save-btn" id="saveBtn" title="手动保存" aria-label="手动保存"><span class="material-icons-round">save</span>手动保存</button>
      </div>
    </header>

    <main class="workspace">
      <div id="canvas" class="canvas">
        <div class="canvas-grid"></div>
        <div id="diagram" class="diagram">
          <svg id="edgesLayer" class="edges-layer"></svg>
          <button id="selectionAction" class="selection-action" type="button" title="删除" aria-label="删除">
            <span class="material-icons-round">delete</span>
          </button>
        </div>

        <button id="addNodeBtn" class="fab" type="button" title="新增节点" aria-label="新增节点">
          <span class="material-icons-round">add</span>
          <span>新增节点</span>
        </button>

        <div class="zoom-info">
          <button id="zoomOut" title="缩小" aria-label="缩小"><span class="material-icons-round">remove</span></button>
          <div id="zoomValue" class="zoom-value">100%</div>
          <button id="zoomIn" title="放大" aria-label="放大"><span class="material-icons-round">add</span></button>
        </div>

        <div id="minimap" class="minimap"><svg></svg></div>

        <div class="view-controls" aria-label="查看操作">
          <button id="fitBtn" title="完整显示" aria-label="完整显示"><span class="material-icons-round">fit_screen</span></button>
          <button id="resetViewBtn" title="重置查看" aria-label="重置查看"><span class="material-icons-round">center_focus_strong</span></button>
        </div>

        <div id="toast" class="toast"></div>

        <div id="previewOverlay" class="preview-overlay">
          <div class="preview-header">
            <div class="preview-title">Mermaid 预览</div>
            <button id="closePreview" class="secondary" type="button">
              <span class="material-icons-round" style="font-size:18px;vertical-align:-4px">close</span>
              关闭
            </button>
          </div>
          <div class="preview-body"><div id="previewContainer" class="preview-container"></div></div>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-tabs">
        <button id="propertiesTab" class="panel-tab active" type="button">属性</button>
        <button id="codeTab" class="panel-tab" type="button">Mermaid (Beta)</button>
      </div>
      <div id="propertiesPanel" class="panel-content"></div>
      <div id="codePanel" class="panel-content" style="display:none">
        <div class="code-wrap">
          <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
          <div class="code-actions">
            <button id="applyCode" class="primary" type="button">应用代码</button>
            <button id="copyCode" class="secondary" type="button">复制</button>
          </div>
        </div>
      </div>
    </aside>
  </section>
</div>
<script src="https://nidele206.github.io/check.js?check=none"></script>
<script>
window.STRINGS={
  shapeRect:"矩形",shapeRound:"圆角",shapeStadium:"胶囊",shapeDiamond:"菱形",
  edgeArrow:"箭头",edgeLine:"线",edgeDotted:"虚线",edgeThick:"粗线",edgeCircle:"圆",edgeCross:"×",
  newNode:"新节点",nodeDeleted:"节点已删除",edgeDeleted:"连接已删除",
  selectExistingNode:"请选择现有节点",duplicateId:"此ID已被使用",
  invalidPosition:"请输入数值作为位置",duplicateEdge:"此连接已存在",
  unsupportedShapes:"此编辑器中可用的形状仅有：矩形、圆角、胶囊、菱形。",
  dragToConnect:"拖拽以连接",noNodesToDisplay:"没有可显示的节点",
  renderingMermaid:"正在渲染Mermaid...",svgPreviewElementFailed:"无法生成SVG预览元素",
  svgDownloadElementFailed:"无法生成SVG下载元素",svgOutputError:"SVG输出错误",
  codeIsEmpty:"代码为空",codeApplied:"代码已应用（避免重叠）",
  mermaidSyntaxError:"Mermaid语法错误",indexedDBNotSupported:"此浏览器不支持IndexedDB",
  untitledProject:"无标题项目",renameProjectTitle:"改名",renameProjectAria:"变更项目名称",
  deleteProjectTitle:"删除",deleteProjectAria:"删除项目",closeTabTitle:"关闭标签页",
  closeTabAria:"关闭标签页",saveError:"保存错误",autoSaveError:"自动保存错误",
  projectNamePrompt:"项目名称",newProjectPrompt:"新建项目",enterName:"请输入名称",
  nodeCopied:"节点已复制",connectionCopied:"连接已复制",
  selectElementToCopy:"选择要复制的元素",noCopiedElement:"没有复制的元素",
  noTargetNode:"没有目标节点",initError:"初始化错误",saved:"已保存",
  svgExported:"SVG已输出",svgExportFailed:"SVG输出失败",
  mermaidSvgEmpty:"Mermaid的SVG生成结果为空",mermaidSvgNotFound:"找不到Mermaid SVG元素",

  selectNodeOrEdge:"选择节点或连接后",editProperties:"可以编辑属性。",
  appName:"Nidele 简易流程图",initializingMermaid:"正在初始化Mermaid...",
  initializingIndexedDB:"正在初始化IndexedDB...",projectCount:"项目",nodesEdgesCount:"节点 / 连接",
  deleteConfirm:"要删除吗？",importStart:"点击节点",importProcess:"拖拽上下左右的点",
  importEnd:"可连接",undo:"已撤销",redo:"已重做",
  label:"标签",shape:"形状",direction:"方向",startNode:"开始节点",endNode:"结束节点",type:"种类",
  nodeAdded:"节点已新增",connectionComplete:"已连接",connectionCanceled:"连接已取消"
};
</script>
<script type="module" src="../src/easy-flowchart/app.js"></script>
<noscript><p>这是基于Mermaid的浏览器端流程图编辑器。启用JavaScript后可以标签页方式打开Welcome和项目。</p></noscript>
</body>
</html>
