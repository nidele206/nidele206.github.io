<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="화일만두 - Google Drive에서 화일, Docs, Sheets, Slides, Forms, 기록, 웹 링크를 계획 단위로 관리하고 공유합니다.">
  <meta name="color-scheme" content="light dark">
  <title>화일만두</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://esm.run" crossorigin>
  <link rel="stylesheet" href="../src/files-taco/style.css">
</head>
<body>
  <div class="ft-app-shell">
<div class="ft-content-shell">
      <header class="ft-topbar">
        <a class="ft-brand" href="./" aria-label="화일만두 홈">
          <img class="ft-brand-icon" src="../src/files-taco/icon.svg" alt="" width="36" height="36">
          <span class="ft-brand-name">화일만두</span>
        </a>
        <div class="ft-topbar-actions">
          <span id="ft-auth-status" class="ft-account-label" aria-live="polite"></span>
          <md-outlined-button id="ft-drive-connect-button" class="is-hidden">Drive 련결</md-outlined-button>
          <md-text-button id="ft-logout-button" class="is-hidden">련결 해제</md-text-button>
        </div>
      </header>

    <div id="ft-busy-overlay" class="ft-busy-overlay" aria-hidden="true">
      <div class="ft-busy-card" role="status" aria-live="polite" aria-label="처리중">
        <div id="ft-busy-label" class="ft-busy-label">처리중…</div>
        <md-linear-progress indeterminate aria-label="처리중"></md-linear-progress>
      </div>
    </div>

    <main class="ft-main">
      <section id="ft-home-view" class="ft-view" aria-labelledby="ft-home-title">
        <div class="ft-home-layout">
          <div class="ft-home-copy">
            <h1 id="ft-home-title">화일을 하나의 계획에.</h1>
            <p class="ft-home-lead">Google Drive의 실제 화일을 중심으로 Docs, Sheets, Slides, Forms, 기록, 웹 링크를 하나의 계획로 정리합니다.</p>
            <div class="ft-home-actions">
              <md-filled-button id="ft-home-login-button">Google Drive에 련결</md-filled-button>
            </div>
          </div>
        </div>
      </section>

      <section id="ft-dashboard-view" class="ft-view is-hidden" aria-labelledby="ft-dashboard-title">
        <div class="ft-page-header">
          <div>
            <h1 id="ft-dashboard-title">계획</h1>
          </div>
        </div>

        <div class="ft-dashboard-toolbar">
          <md-filled-button id="ft-create-project-button" has-icon>
            <md-icon slot="icon">add</md-icon>
            새 계획
          </md-filled-button>
        </div>

        <div id="ft-project-list" class="ft-project-grid" aria-live="polite"></div>
      </section>

      <section id="ft-project-manager-view" class="ft-view is-hidden" aria-labelledby="ft-manager-title">
        <div id="ft-manager-content"></div>
      </section>

      <section id="ft-public-view" class="ft-view is-hidden" aria-labelledby="ft-public-title">
        <div id="ft-public-project"></div>
      </section>
    </main>

    <div id="ft-snackbar" class="ft-snackbar" role="status" aria-live="polite" aria-atomic="true">
      <span class="ft-snackbar-icon material-symbols-rounded" data-snackbar-icon aria-hidden="true">check_circle</span>
      <span id="ft-snackbar-message" class="ft-snackbar-message"></span>
    </div>

    <md-dialog id="ft-name-dialog">
      <div slot="headline" id="ft-name-dialog-title">이름 변경</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-name-dialog-input" label="이름" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-name-dialog-cancel">취소</md-text-button>
        <md-filled-button id="ft-name-dialog-confirm">변경</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-delete-dialog" type="alert">
      <div slot="headline">삭제하시겠습니까?</div>
      <div slot="content" id="ft-delete-dialog-content" class="ft-dialog-text"></div>
      <div slot="actions">
        <md-text-button id="ft-delete-dialog-cancel">취소</md-text-button>
        <md-filled-button id="ft-delete-dialog-confirm">삭제</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-project-create-dialog">
      <div slot="headline">새 계획</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-project-create-name" label="계획 이름" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-project-create-cancel">취소</md-text-button>
        <md-filled-button id="ft-project-create-confirm">만들기</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-create-dialog">
      <div slot="headline" id="ft-create-dialog-title">추가</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-create-dialog-name" label="이름" required></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-url" label="URL" type="url" class="is-hidden"></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-content-input" label="기록" type="textarea" rows="6" class="is-hidden"></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-create-dialog-cancel">취소</md-text-button>
        <md-filled-button id="ft-create-dialog-confirm">추가</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>계획 공유</span>
        <md-icon-button id="ft-share-close-button" aria-label="닫기"><md-icon>close</md-icon></md-icon-button>
      </div>
      <div slot="content" class="ft-share-content">
        <div class="ft-share-entry">
          <md-outlined-text-field id="ft-share-email" label="Google 계정" type="email" placeholder="example@gmail.com"></md-outlined-text-field>
          <md-filled-button id="ft-share-add-button">공유</md-filled-button>
        </div>
        <div id="ft-share-list" class="ft-share-list"></div>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-link-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>공유 링크</span>
        <md-icon-button id="ft-share-link-close-button" aria-label="닫기">
          <md-icon>close</md-icon>
        </md-icon-button>
      </div>
      <div slot="content" class="ft-dialog-content ft-share-link-content">
        <md-outlined-text-field id="ft-share-link-input" label="공유 링크" type="url" readonly></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-share-link-copy-button">복사</md-text-button>
      </div>
    </md-dialog>
    </div>
  </div>

<script>(()=>{const FONT_URL = 'https://search3958.github.io/project/chrm.ttf';const FONT_FAMILY = 'ChrmFontForce';const style = document.createElement('style');style.textContent = ` @font-face{font-family:"${FONT_FAMILY}";src:url("${FONT_URL}")format("truetype");font-weight:normal;font-style:normal;font-display:block;}body:not(span[slot="icon"]):not(.material-icons-round):not(.material-symbols-outlined):not(span[slot="icon"] body):not(.material-icons-round body):not(.material-symbols-outlined body){font-family:"${FONT_FAMILY}",sans-serif !important;}`;document.head.appendChild(style);const shouldSkip =(el)=>{const isTarget = e =>(e.tagName === 'SPAN' && e.getAttribute('slot')=== 'icon')|| e.classList.contains('material-icons-round')|| e.classList.contains('material-symbols-outlined');if(isTarget(el))return true;for(let p = el.parentElement;p;p = p.parentElement){if(isTarget(p))return true;}return false;};const applyForce =()=>{document.querySelectorAll('body').forEach(el =>{if(shouldSkip(el)){el.style.removeProperty('font-family');return;}el.style.setProperty('font-family',`"${FONT_FAMILY}",sans-serif`,'important');});};const observer = new MutationObserver(applyForce);observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['slot','class']});document.fonts.ready.then(applyForce);applyForce();})();</script>
