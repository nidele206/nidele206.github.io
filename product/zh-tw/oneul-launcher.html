<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>站點啟動器</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/oneul-launcher/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">站點啟動器</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          新增看板
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">工作</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="更多">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="launchAllBtn">
              <span class="material-symbols-outlined" slot="icon">open_in_new</span>
              全部啟動
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="備註輸入框。自動保存。"></textarea>
        </section>

        <section class="links-panel">
          <div class="links-head">
            <div class="links-head-title"><strong>鏈結</strong><span id="linkCount">0個</span></div>
            <md-outlined-button id="addLinkBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              添加鏈結
            </md-outlined-button>
          </div>
          <div class="link-list" id="linkList"></div>
        </section>
      </div>

      <div class="main-inner" id="overviewView" style="display:none">
        <p id="overviewGreeting" class="overview-greeting"></p>
        <div class="overview-meta">
          <a class="overview-meta-link" href="https://nidele206.github.io/" target="_blank" rel="noopener noreferrer">關於Nidele系列</a>
          <span class="overview-meta-sep">/</span>
          <a class="overview-meta-link" href="https://nidele206.github.io/policies/" target="_blank" rel="noopener noreferrer">服務條款及隱私政策</a>
        </div>
        <section class="links-panel">
          <div class="links-head">


            <div class="links-head-title"><strong>前5個鏈結</strong></div>
          </div>
          <div class="link-list" id="overviewContent"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">編輯</md-menu-item>
    <md-menu-item id="menuDelete">刪除</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">編輯名稱</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">刪除分組</md-menu-item>
  </md-menu>

  <!-- Delete confirmation dialog -->
  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">刪除分組</div>
    <div slot="content" class="dialog-body">
      <p>是否刪除此分組？此操作不可撤銷。</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">取消</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">刪除</md-filled-button>
    </div>
  </md-dialog>

  <!-- Link dialog -->
  <md-dialog id="linkDialog">
    <div slot="headline" id="linkDialogTitle">添加鏈結</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="nameField" label="名稱" supporting-text="列表中顯示的標題" required></md-outlined-text-field>
      <md-outlined-text-field id="urlField" label="鏈結" supporting-text="以https://開頭的URL" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="linkCancelBtn">取消</md-text-button>
      <md-filled-button id="linkSaveBtn">保存</md-filled-button>
    </div>
  </md-dialog>

  <!-- Workspace dialog -->
  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">新建啟動看板</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="標題" supporting-text="例如：工作、開發、學習、調查" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">取消</md-text-button>
      <md-filled-button id="workspaceSaveBtn">添加</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/oneul-launcher/app.js"></script>

   <script src="https://nidele206.github.io/check.js?check=none"></script>

 <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCNW6MLLLT"></script>

   function gtag(){dataLayer.push(arguments);}
   gtag('js', new Date());

   gtag('config', 'G-SCNW6MLLLT');
 </script>
</body>
</html>
