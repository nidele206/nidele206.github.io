<!--정상이 아니면 죽여라-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>스테이션 런처</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/oneul-launcher/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">스테이션 런처</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          새 보드
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">일</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="더보기">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="launchAllBtn">
              <span class="material-symbols-outlined" slot="icon">open_in_new</span>
              일괄 실행
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="메모 입력란. 자동으로 저장됩니다."></textarea>
        </section>

        <section class="links-panel">
          <div class="links-head">
            <div class="links-head-title"><strong>링크</strong><span id="linkCount">0개</span></div>
            <md-outlined-button id="addLinkBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              링크 추가
            </md-outlined-button>
          </div>
          <div class="link-list" id="linkList"></div>
        </section>
      </div>

      <div class="main-inner" id="overviewView" style="display:none">
        <p id="overviewGreeting" class="overview-greeting"></p>
        <div class="overview-meta">
          <a class="overview-meta-link" href="https://nidele206.github.io/" target="_blank" rel="noopener noreferrer">Nidele 시리즈 정보</a>
          <span class="overview-meta-sep">/</span>
          <a class="overview-meta-link" href="https://nidele206.github.io/policies/" target="_blank" rel="noopener noreferrer">이용약관 및 개인정보처리방침</a>
        </div>
        <section class="links-panel">
          <div class="links-head">


            <div class="links-head-title"><strong>상위 5개 링크</strong></div>
          </div>
          <div class="link-list" id="overviewContent"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">편집</md-menu-item>
    <md-menu-item id="menuDelete">삭제</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">이름 편집</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">그룹 삭제</md-menu-item>
  </md-menu>

  <!-- Delete confirmation dialog -->
  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">그룹 삭제</div>
    <div slot="content" class="dialog-body">
      <p>이 그룹을 삭제하시겠습니까? 이 작업은 취소할 수 없습니다.</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">취소</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">삭제</md-filled-button>
    </div>
  </md-dialog>

  <!-- Link dialog -->
  <md-dialog id="linkDialog">
    <div slot="headline" id="linkDialogTitle">링크 추가</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="nameField" label="이름" supporting-text="목록에 표시할 제목" required></md-outlined-text-field>
      <md-outlined-text-field id="urlField" label="링크" supporting-text="https://로 시작하는 URL" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="linkCancelBtn">취소</md-text-button>
      <md-filled-button id="linkSaveBtn">저장</md-filled-button>
    </div>
  </md-dialog>

  <!-- Workspace dialog -->
  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">새 런처 보드</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="제목" supporting-text="예: 일, 개발, 공부, 조사" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">취소</md-text-button>
      <md-filled-button id="workspaceSaveBtn">추가</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/oneul-launcher/app.js"></script>

   <script src="https://nidele206.github.io/check.js?check=none"></script>

   <!-- Google tag (gtag.js) -->
 <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCNW6MLLLT"></script>
 <script>
   window.dataLayer = window.dataLayer || [];
   function gtag(){dataLayer.push(arguments);}
   gtag('js', new Date());

   gtag('config', 'G-SCNW6MLLLT');
 </script>
</body>
</html>
