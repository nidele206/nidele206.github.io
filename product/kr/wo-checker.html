<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>체커</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/wo-checker/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">체커</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          새 카테고리
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">카테고리</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="더보기">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="clearDoneBtn">
              <span class="material-symbols-outlined" slot="icon">playlist_remove</span>
              완료 삭제
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="메모입니다. 자동으로 저장됩니다."></textarea>
        </section>

        <section class="tasks-panel">
          <div class="tasks-head">
            <div class="tasks-head-title"><strong>작업</strong><span id="taskCount">0개</span></div>
          </div>
          <div class="add-task-row">
            <md-outlined-text-field id="quickAddField" label="새 작업" required></md-outlined-text-field>
            <md-filled-button id="quickAddBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              추가
            </md-filled-button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">편집</md-menu-item>
    <md-menu-item id="menuDelete">삭제</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">이름 편집</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">그룹 삭제</md-menu-item>
  </md-menu>

  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">그룹 삭제</div>
    <div slot="content" class="dialog-body">
      <p>이 그룹을 삭제하시겠습니까? 이 작업은 취소할 수 없습니다.</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">취소</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">삭제</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="taskDialog">
    <div slot="headline" id="taskDialogTitle">작업 추가</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="taskTextField" label="작업 이름" supporting-text="체크리스트에 표시할 항목" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="taskCancelBtn">취소</md-text-button>
      <md-filled-button id="taskSaveBtn">저장</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">새 카테고리</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="제목" supporting-text="예: 일, 쇼핑, 여행" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">취소</md-text-button>
      <md-filled-button id="workspaceSaveBtn">추가</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/wo-checker/app.js"></script>
   <script src="https://nidele206.github.io/check.js?check=none"></script>
</body>
</html>
