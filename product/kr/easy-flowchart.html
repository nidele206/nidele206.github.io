<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉬운 플로차트 — Mermaid 기반 플로차트 편집기</title>
<meta name="description" content="Mermaid를 지원하는 브라우저 기반 플로차트 편집기입니다. Welcome과 프로젝트를 탭으로 열고 프로젝트를 바로 편집할 수 있습니다.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1a73e8">
<link rel="canonical" href="./">
<meta property="og:type" content="website">

<meta property="og:description" content="Welcome과 프로젝트를 탭으로 열어 노드와 화살표를 직관적으로 편집할 수 있는 Mermaid 기반 플로차트 편집기입니다.">
<meta property="og:image" content="icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="쉬운 플로차트 — Mermaid 기반 플로차트 편집기">
<meta name="twitter:description" content="브라우저에서 사용할 수 있는 Mermaid 기반 플로차트 편집기입니다.">
<link rel="icon" type="image/png" href="../src/easy-flowchart/icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"쉬운 플로차트","applicationCategory":"DesignApplication","operatingSystem":"Web Browser","description":"Mermaid를 지원하는 브라우저 기반 플로차트 편집기입니다.","url":"./"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/easy-flowchart/style.css">
</head>
<body>
<div class="app">
  <header class="topbar workspace-tabs-bar">
    <div id="topTabs" class="top-tabs" role="tablist" aria-label="열린 탭"></div>
    <button id="newTopTabBtn" class="new-top-tab" type="button" title="새 탭" aria-label="새 탭">
      <span class="material-icons-round">add</span>
    </button>
  </header>

  <!-- Welcome 자체가 최상위 탭의 내용입니다. 여기서 프로젝트를 열면 현재 Welcome 탭이 프로젝트 탭으로 바뀝니다. -->
  <main id="welcomeView" class="welcome-view" hidden>
    <section class="welcome-shell">
      <img class="welcome-logo" src="../src/easy-flowchart/icon.png" alt="쉬운 플로차트" width="96" height="96">
      <div class="welcome-eyebrow">Nidele Series</div>
      <h1>쉬운 플로차트</h1>
      <p>"새 프로젝트"로 시작하세요</p>
      <button id="createProjectBtn" class="primary welcome-create" type="button">
        <span class="material-icons-round">add</span>새 프로젝트
      </button>
    </section>
    <section class="project-section" aria-labelledby="projectSectionTitle">
      <div class="project-section-head">
        <div>
          <h2 id="projectSectionTitle">프로젝트</h2>
        </div>
      </div>
      <div id="projectGrid" class="project-grid"></div>
      <div id="projectEmpty" class="project-empty" hidden>
        <span class="material-icons-round">folder_open</span>
        <strong>아직 프로젝트가 없습니다</strong>
        <p>"새 프로젝트"에서 만들 수 있습니다.</p>
      </div>
    </section>
  </main>

  <!-- 프로젝트 탭의 내용입니다. 프로젝트는 하나의 편집 문서이며 내부에 파일 탭을 갖지 않습니다. -->
  <section id="editorView" class="editor-view" hidden>
    <header class="topbar project-toolbar">
      <div id="status" class="status">준비 중...</div>
      <div class="top-actions">
        <button class="icon-btn" id="renameBtn" title="이름 변경" aria-label="이름 변경"><span class="material-icons-round">edit</span>이름 변경</button>
        <button class="icon-btn" id="undoBtn" title="되돌리기" aria-label="되돌리기"><span class="material-icons-round">undo</span></button>
        <button class="icon-btn" id="redoBtn" title="다시 하기" aria-label="다시 하기"><span class="material-icons-round">redo</span></button>
        <button class="icon-btn" id="previewBtn" title="Mermaid 미리보기" aria-label="Mermaid 미리보기"><span class="material-icons-round">play_arrow</span>SVG 미리보기</button>
        <button class="icon-btn" id="exportBtn" title="SVG 내보내기" aria-label="SVG 내보내기"><span class="material-icons-round">download</span>다운로드</button>
        <button class="icon-btn save-btn" id="saveBtn" title="수동 저장" aria-label="수동 저장"><span class="material-icons-round">save</span>수동 저장</button>
      </div>
    </header>

    <main class="workspace">
      <div id="canvas" class="canvas">
        <div class="canvas-grid"></div>
        <div id="diagram" class="diagram">
          <svg id="edgesLayer" class="edges-layer"></svg>
          <button id="selectionAction" class="selection-action" type="button" title="삭제" aria-label="삭제">
            <span class="material-icons-round">delete</span>
          </button>
        </div>

        <button id="addNodeBtn" class="fab" type="button" title="노드 추가" aria-label="노드 추가">
          <span class="material-icons-round">add</span>
          <span>노드 추가</span>
        </button>

        <div class="zoom-info">
          <button id="zoomOut" title="축소" aria-label="축소"><span class="material-icons-round">remove</span></button>
          <div id="zoomValue" class="zoom-value">100%</div>
          <button id="zoomIn" title="확대" aria-label="확대"><span class="material-icons-round">add</span></button>
        </div>

        <div id="minimap" class="minimap"><svg></svg></div>

        <div class="view-controls" aria-label="보기 조작">
          <button id="fitBtn" title="전체 화면" aria-label="전체 화면"><span class="material-icons-round">fit_screen</span></button>
          <button id="resetViewBtn" title="보기 재설정" aria-label="보기 재설정"><span class="material-icons-round">center_focus_strong</span></button>
        </div>

        <div id="toast" class="toast"></div>

        <div id="previewOverlay" class="preview-overlay">
          <div class="preview-header">
            <div class="preview-title">Mermaid 미리보기</div>
            <button id="closePreview" class="secondary" type="button">
              <span class="material-icons-round" style="font-size:18px;vertical-align:-4px">close</span>
              닫기
            </button>
          </div>
          <div class="preview-body"><div id="previewContainer" class="preview-container"></div></div>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-tabs">
        <button id="propertiesTab" class="panel-tab active" type="button">속성</button>
        <button id="codeTab" class="panel-tab" type="button">Mermaid (Beta)</button>
      </div>
      <div id="propertiesPanel" class="panel-content"></div>
      <div id="codePanel" class="panel-content" style="display:none">
        <div class="code-wrap">
          <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
          <div class="code-actions">
            <button id="applyCode" class="primary" type="button">코드 적용</button>
            <button id="copyCode" class="secondary" type="button">복사</button>
          </div>
        </div>
      </div>
    </aside>
  </section>
</div>
<script src="https://nidele206.github.io/check.js?check=none"></script>
