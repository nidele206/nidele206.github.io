<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>Checker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/wo-checker/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">Checker</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          New Category
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">Category</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="More">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="clearDoneBtn">
              <span class="material-symbols-outlined" slot="icon">playlist_remove</span>
              Clear Completed
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="Memo. Saved automatically."></textarea>
        </section>

        <section class="tasks-panel">
          <div class="tasks-head">
            <div class="tasks-head-title"><strong>Tasks</strong><span id="taskCount">0 items</span></div>
          </div>
          <div class="add-task-row">
            <md-outlined-text-field id="quickAddField" label="New Task" required></md-outlined-text-field>
            <md-filled-button id="quickAddBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              Add
            </md-filled-button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">Edit</md-menu-item>
    <md-menu-item id="menuDelete">Delete</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">Edit Name</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">Delete Group</md-menu-item>
  </md-menu>

  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">Delete Group</div>
    <div slot="content" class="dialog-body">
      <p>Delete this group? This action cannot be undone.</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">Cancel</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">Delete</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="taskDialog">
    <div slot="headline" id="taskDialogTitle">Add Task</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="taskTextField" label="Task Name" supporting-text="Item to display on checklist" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="taskCancelBtn">Cancel</md-text-button>
      <md-filled-button id="taskSaveBtn">Save</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">New Category</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="Title" supporting-text="E.g., Work, Shopping, Travel" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">Cancel</md-text-button>
      <md-filled-button id="workspaceSaveBtn">Add</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/wo-checker/app.js"></script>
   <script src="https://nidele206.github.io/check.js?check=none"></script>
</body>
</html>
