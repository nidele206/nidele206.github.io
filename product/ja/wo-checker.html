<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>チェッカー</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/wo-checker/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">チェッカー</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          新規カテゴリ
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">カテゴリ</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="その他">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="clearDoneBtn">
              <span class="material-symbols-outlined" slot="icon">playlist_remove</span>
              完了をクリア
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="メモ。自動的に保存されます。"></textarea>
        </section>

        <section class="tasks-panel">
          <div class="tasks-head">
            <div class="tasks-head-title"><strong>タスク</strong><span id="taskCount">0件</span></div>
          </div>
          <div class="add-task-row">
            <md-outlined-text-field id="quickAddField" label="新しいタスク" required></md-outlined-text-field>
            <md-filled-button id="quickAddBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              追加
            </md-filled-button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">編集</md-menu-item>
    <md-menu-item id="menuDelete">削除</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">名前を編集</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">グループ削除</md-menu-item>
  </md-menu>

  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">グループを削除</div>
    <div slot="content" class="dialog-body">
      <p>このグループを削除しますか？ この操作は取り消せません。</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">削除</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="taskDialog">
    <div slot="headline" id="taskDialogTitle">タスクを追加</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="taskTextField" label="タスク名" supporting-text="チェックリストに表示する項目" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="taskCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="taskSaveBtn">保存</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">新しいカテゴリ</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="タイトル" supporting-text="例：仕事、買い物、旅行" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="workspaceSaveBtn">追加</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/wo-checker/app.js"></script>
   <script src="https://nidele206.github.io/check.js?check=none"></script>
</body>
</html>
