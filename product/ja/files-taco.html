<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Files Taco - Google Driveでファイル、Docs、Sheets、Slides、Forms、メモ、Webリンクをプロジェクト単位で管理・共有">
  <meta name="color-scheme" content="light dark">
  <title>Files Taco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://esm.run" crossorigin>
  <link rel="stylesheet" href="../src/files-taco/style.css">
</head>
<body>
  <div class="ft-app-shell">
<div class="ft-content-shell">
      <header class="ft-topbar">
        <a class="ft-brand" href="./" aria-label="Files Taco ホーム">
          <img class="ft-brand-icon" src="../src/files-taco/icon.svg" alt="" width="36" height="36">
          <span class="ft-brand-name">Files Taco</span>
        </a>
        <div class="ft-topbar-actions">
          <span id="ft-auth-status" class="ft-account-label" aria-live="polite"></span>
          <md-outlined-button id="ft-drive-connect-button" class="is-hidden">Driveへ接続</md-outlined-button>
          <md-text-button id="ft-logout-button" class="is-hidden">接続解除</md-text-button>
        </div>
      </header>

    <div id="ft-busy-overlay" class="ft-busy-overlay" aria-hidden="true">
      <div class="ft-busy-card" role="status" aria-live="polite" aria-label="処理中">
        <div id="ft-busy-label" class="ft-busy-label">処理中…</div>
        <md-linear-progress indeterminate aria-label="処理中"></md-linear-progress>
      </div>
    </div>

    <main class="ft-main">
      <section id="ft-home-view" class="ft-view" aria-labelledby="ft-home-title">
        <div class="ft-home-layout">
          <div class="ft-home-copy">
            <h1 id="ft-home-title">ファイルを、ひとつのプロジェクトに。</h1>
            <p class="ft-home-lead">Google Driveの実ファイルを中心に、Docs、Sheets、Slides、Forms、メモ、Webリンクをひとつのプロジェクトへまとめます。</p>
            <div class="ft-home-actions">
              <md-filled-button id="ft-home-login-button">Google Driveに接続</md-filled-button>
            </div>
          </div>
        </div>
      </section>

      <section id="ft-dashboard-view" class="ft-view is-hidden" aria-labelledby="ft-dashboard-title">
        <div class="ft-page-header">
          <div>
            <h1 id="ft-dashboard-title">プロジェクト</h1>
          </div>
        </div>

        <div class="ft-dashboard-toolbar">
          <md-filled-button id="ft-create-project-button" has-icon>
            <md-icon slot="icon">add</md-icon>
            新しいプロジェクト
          </md-filled-button>
        </div>

        <div id="ft-project-list" class="ft-project-grid" aria-live="polite"></div>
      </section>

      <section id="ft-project-manager-view" class="ft-view is-hidden" aria-labelledby="ft-manager-title">
        <div id="ft-manager-content"></div>
      </section>

      <section id="ft-public-view" class="ft-view is-hidden" aria-labelledby="ft-public-title">
        <div id="ft-public-project"></div>
      </section>
    </main>

    <div id="ft-snackbar" class="ft-snackbar" role="status" aria-live="polite" aria-atomic="true">
      <span class="ft-snackbar-icon material-symbols-rounded" data-snackbar-icon aria-hidden="true">check_circle</span>
      <span id="ft-snackbar-message" class="ft-snackbar-message"></span>
    </div>

    <md-dialog id="ft-name-dialog">
      <div slot="headline" id="ft-name-dialog-title">名前を変更</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-name-dialog-input" label="名前" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-name-dialog-cancel">キャンセル</md-text-button>
        <md-filled-button id="ft-name-dialog-confirm">変更</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-delete-dialog" type="alert">
      <div slot="headline">削除しますか？</div>
      <div slot="content" id="ft-delete-dialog-content" class="ft-dialog-text"></div>
      <div slot="actions">
        <md-text-button id="ft-delete-dialog-cancel">キャンセル</md-text-button>
        <md-filled-button id="ft-delete-dialog-confirm">削除</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-project-create-dialog">
      <div slot="headline">新しいプロジェクト</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-project-create-name" label="プロジェクト名" required></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-project-create-cancel">キャンセル</md-text-button>
        <md-filled-button id="ft-project-create-confirm">作成</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-create-dialog">
      <div slot="headline" id="ft-create-dialog-title">追加</div>
      <div slot="content" class="ft-dialog-content">
        <md-outlined-text-field id="ft-create-dialog-name" label="名前" required></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-url" label="URL" type="url" class="is-hidden"></md-outlined-text-field>
        <md-outlined-text-field id="ft-create-dialog-content-input" label="メモ" type="textarea" rows="6" class="is-hidden"></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-create-dialog-cancel">キャンセル</md-text-button>
        <md-filled-button id="ft-create-dialog-confirm">追加</md-filled-button>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>プロジェクトを共有</span>
        <md-icon-button id="ft-share-close-button" aria-label="閉じる"><md-icon>close</md-icon></md-icon-button>
      </div>
      <div slot="content" class="ft-share-content">
        <div class="ft-share-entry">
          <md-outlined-text-field id="ft-share-email" label="Googleアカウント" type="email" placeholder="example@gmail.com"></md-outlined-text-field>
          <md-filled-button id="ft-share-add-button">共有</md-filled-button>
        </div>
        <div id="ft-share-list" class="ft-share-list"></div>
      </div>
    </md-dialog>

    <md-dialog id="ft-share-link-dialog">
      <div slot="headline" class="ft-dialog-headline-with-close">
        <span>共有リンク</span>
        <md-icon-button id="ft-share-link-close-button" aria-label="閉じる">
          <md-icon>close</md-icon>
        </md-icon-button>
      </div>
      <div slot="content" class="ft-dialog-content ft-share-link-content">
        <md-outlined-text-field id="ft-share-link-input" label="共有リンク" type="url" readonly></md-outlined-text-field>
      </div>
      <div slot="actions">
        <md-text-button id="ft-share-link-copy-button">コピー</md-text-button>
      </div>
    </md-dialog>
    </div>
  </div>
