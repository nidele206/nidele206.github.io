<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>持ち場ランチャー</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/oneul-launcher/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">持ち場ランチャー</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          新規ボード
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">仕事</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="その他">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="launchAllBtn">
              <span class="material-symbols-outlined" slot="icon">open_in_new</span>
              一括起動
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="付箋入力欄。自動的に保存されます。"></textarea>
        </section>

        <section class="links-panel">
          <div class="links-head">
            <div class="links-head-title"><strong>リンク</strong><span id="linkCount">0件</span></div>
            <md-outlined-button id="addLinkBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              リンクを追加
            </md-outlined-button>
          </div>
          <div class="link-list" id="linkList"></div>
        </section>
      </div>

      <div class="main-inner" id="overviewView" style="display:none">
        <p id="overviewGreeting" class="overview-greeting"></p>
        <div class="overview-meta">
          <a class="overview-meta-link" href="https://nidele206.github.io/" target="_blank" rel="noopener noreferrer">Nideleシリーズについて</a>
          <span class="overview-meta-sep">/</span>
          <a class="overview-meta-link" href="https://nidele206.github.io/policies/" target="_blank" rel="noopener noreferrer">利用規約 および 個人情報処理政策</a>
        </div>
        <section class="links-panel">
          <div class="links-head">


            <div class="links-head-title"><strong>上位5件のリンク</strong></div>
          </div>
          <div class="link-list" id="overviewContent"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">編集</md-menu-item>
    <md-menu-item id="menuDelete">削除</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">名前を編集</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">グループ削除</md-menu-item>
  </md-menu>

  <!-- Delete confirmation dialog -->
  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">グループを削除</div>
    <div slot="content" class="dialog-body">
      <p>このグループを削除しますか？ この操作は取り消せません。</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">削除</md-filled-button>
    </div>
  </md-dialog>

  <!-- Link dialog -->
  <md-dialog id="linkDialog">
    <div slot="headline" id="linkDialogTitle">リンクを追加</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="nameField" label="名前" supporting-text="一覧に表示するタイトル" required></md-outlined-text-field>
      <md-outlined-text-field id="urlField" label="リンク" supporting-text="https:// から始まるURL" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="linkCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="linkSaveBtn">保存</md-filled-button>
    </div>
  </md-dialog>

  <!-- Workspace dialog -->
  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">新しい起動ボード</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="タイトル" supporting-text="例：仕事、開発、勉強、調査" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">キャンセル</md-text-button>
      <md-filled-button id="workspaceSaveBtn">追加</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/oneul-launcher/app.js"></script>

   <script src="https://nidele206.github.io/check.js?check=none"></script>

  gtag('config', 'G-SCNW6MLLLT');
</script>
</body>
</html>
