<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <title>चेकर</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="icon" href="../src/oneul-launcher/icon.png" type="image/png">
  <link rel="stylesheet" href="../src/wo-checker/style.css">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
    import '@material/web/all.js';
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-title">चेकर</div>
      </div>
      <div class="tab-list" id="workspaceList"></div>
      <div class="sidebar-bottom">
        <md-outlined-button id="addWorkspaceBtn">
          <span class="material-symbols-outlined" slot="icon">add</span>
          नया श्रेणी
        </md-outlined-button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner" id="workspaceView">
        <header class="page-head">
          <div class="page-head-copy">
            <h1 class="page-title" id="workspaceTitle">श्रेणी</h1>
          </div>
          <div class="page-actions">
            <md-icon-button id="workspaceMenuBtn" aria-label="अधिक">
              <span class="material-symbols-outlined">more_vert</span>
            </md-icon-button>
            <md-filled-button id="clearDoneBtn">
              <span class="material-symbols-outlined" slot="icon">playlist_remove</span>
              पूर्ण को साफ़ करें
            </md-filled-button>
          </div>
        </header>

        <section class="memo-area">
          <textarea id="memo" class="memo-box" placeholder="नोट। स्वचालित रूप से सहेजा जाता है।"></textarea>
        </section>

        <section class="tasks-panel">
          <div class="tasks-head">
            <div class="tasks-head-title"><strong>कार्य</strong><span id="taskCount">0 आइटम</span></div>
          </div>
          <div class="add-task-row">
            <md-outlined-text-field id="quickAddField" label="नया कार्य" required></md-outlined-text-field>
            <md-filled-button id="quickAddBtn">
              <span class="material-symbols-outlined" slot="icon">add</span>
              जोड़ें
            </md-filled-button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </div>
    </main>
  </div>

  <md-menu id="rowMenu" positioning="fixed">
    <md-menu-item id="menuEdit">संपादित करें</md-menu-item>
    <md-menu-item id="menuDelete">हटाएं</md-menu-item>
  </md-menu>

  <md-menu id="workspaceMenu" positioning="fixed">
    <md-menu-item id="menuWorkspaceEdit">नाम संपादित करें</md-menu-item>
    <md-menu-item id="menuWorkspaceDelete">समूह हटाएं</md-menu-item>
  </md-menu>

  <md-dialog id="deleteWorkspaceDialog">
    <div slot="headline">समूह हटाएं</div>
    <div slot="content" class="dialog-body">
      <p>क्या आप इस समूह को हटाना चाहते हैं? यह कार्य वापस नहीं लिया जा सकता।</p>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="deleteWorkspaceCancelBtn">रद्द करें</md-text-button>
      <md-filled-button id="deleteWorkspaceConfirmBtn">हटाएं</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="taskDialog">
    <div slot="headline" id="taskDialogTitle">कार्य जोड़ें</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="taskTextField" label="कार्य का नाम" supporting-text="चेकलिस्ट पर दिखाने का आइटम" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="taskCancelBtn">रद्द करें</md-text-button>
      <md-filled-button id="taskSaveBtn">सहेजें</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog id="workspaceDialog">
    <div slot="headline" id="workspaceDialogHeadline">नया श्रेणी</div>
    <div slot="content" class="dialog-body">
      <md-outlined-text-field id="workspaceNameField" label="शीर्षक" supporting-text="उदा.: काम, खरीदारी, यात्रा" required></md-outlined-text-field>
    </div>
    <div slot="actions" class="dialog-actions">
      <md-text-button id="workspaceCancelBtn">रद्द करें</md-text-button>
      <md-filled-button id="workspaceSaveBtn">जोड़ें</md-filled-button>
    </div>
  </md-dialog>

   <script src="../src/wo-checker/app.js"></script>
   <script src="https://nidele206.github.io/check.js?check=none"></script>
</body>
</html>
