<meta property="og:description" content="वेलकम और प्रोजेक्ट को टैब में खोलकर नोड और तीरों को सहज ढंग से संपादित करने की अनुमति देने वाला मरमेड आधारित फ्लोचार्ट संपादक।">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"आसान फ्लोचार्ट","applicationCategory":"DesignApplication","operatingSystem":"Web Browser","description":"मरमेड समर्थन के साथ ब्राउज़र-आधारित फ्लोचार्ट संपादक।","url":"./"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app">
  <header class="topbar workspace-tabs-bar">
    <div id="topTabs" class="top-tabs" role="tablist" aria-label="खुले टैब"></div>
    <button id="newTopTabBtn" class="new-top-tab" type="button" title="नया टैब" aria-label="नया टैब">
      <span class="material-icons-round">add</span>
    </button>
  </header>

  <!-- वेलकम स्वयं सबसे ऊपरी टैब की सामग्री है। यहाँ से प्रोजेक्ट खोलने पर वर्तमान वेलकम टैब प्रोजेक्ट टैब में बदल जाता है। -->
  <main id="welcomeView" class="welcome-view" hidden>
    <section class="welcome-shell">
      <img class="welcome-logo" src="../src/easy-flowchart/icon.png" alt="आसान फ्लोचार्ट" width="96" height="96">
      <div class="welcome-eyebrow">Nidele Series</div>
      <h1>आसान फ्लोचार्ट</h1>
      <p>"नया प्रोजेक्ट" से शुरू करें</p>
      <button id="createProjectBtn" class="primary welcome-create" type="button">
        <span class="material-icons-round">add</span>नया प्रोजेक्ट
      </button>
    </section>
    <section class="project-section" aria-labelledby="projectSectionTitle">
      <div class="project-section-head">
        <div>
          <h2 id="projectSectionTitle">प्रोजेक्ट</h2>
        </div>
      </div>
      <div id="projectGrid" class="project-grid"></div>
      <div id="projectEmpty" class="project-empty" hidden>
        <span class="material-icons-round">folder_open</span>
        <strong>अभी तक कोई प्रोजेक्ट नहीं है</strong>
        <p>आप "नया प्रोजेक्ट" से बना सकते हैं।</p>
      </div>
    </section>
  </main>

  <!-- प्रोजेक्ट टैब की सामग्री। प्रोजेक्ट एक एकल संपादन दस्तावेज़ है और अंदर फ़ाइल टैब नहीं रखता। -->
  <section id="editorView" class="editor-view" hidden>
    <header class="topbar project-toolbar">
      <div id="status" class="status">तैयार...</div>
      <div class="top-actions">
        <button class="icon-btn" id="renameBtn" title="नाम बदलें" aria-label="नाम बदलें"><span class="material-icons-round">edit</span>नाम बदलें</button>
        <button class="icon-btn" id="undoBtn" title="पूर्ववत" aria-label="पूर्ववत"><span class="material-icons-round">undo</span></button>
        <button class="icon-btn" id="redoBtn" title="दोहराएं" aria-label="दोहराएं"><span class="material-icons-round">redo</span></button>
        <button class="icon-btn" id="previewBtn" title="मरमेड पूर्वावलोकन" aria-label="मरमेड पूर्वावलोकन"><span class="material-icons-round">play_arrow</span>SVG पूर्वावलोकन</button>
        <button class="icon-btn" id="exportBtn" title="SVG निकालें" aria-label="SVG निकालें"><span class="material-icons-round">download</span>डाउनलोड</button>
        <button class="icon-btn save-btn" id="saveBtn" title="मैन्युअल सहेजें" aria-label="मैन्युअल सहेजें"><span class="material-icons-round">save</span>मैन्युअल सहेजें</button>
      </div>
    </header>

    <main class="workspace">
      <div id="canvas" class="canvas">
        <div class="canvas-grid"></div>
        <div id="diagram" class="diagram">
          <svg id="edgesLayer" class="edges-layer"></svg>
          <button id="selectionAction" class="selection-action" type="button" title="हटाएं" aria-label="हटाएं">
            <span class="material-icons-round">delete</span>
          </button>
        </div>

        <button id="addNodeBtn" class="fab" type="button" title="नोड जोड़ें" aria-label="नोड जोड़ें">
          <span class="material-icons-round">add</span>
          <span>नोड जोड़ें</span>
        </button>

        <div class="zoom-info">
          <button id="zoomOut" title="ज़ूम आउट" aria-label="ज़ूम आउट"><span class="material-icons-round">remove</span></button>
          <div id="zoomValue" class="zoom-value">100%</div>
          <button id="zoomIn" title="ज़ूम इन" aria-label="ज़ूम इन"><span class="material-icons-round">add</span></button>
        </div>

        <div id="minimap" class="minimap"><svg></svg></div>

        <div class="view-controls" aria-label="दृश्य नियंत्रण">
          <button id="fitBtn" title="स्क्रीन में फिट करें" aria-label="स्क्रीन में फिट करें"><span class="material-icons-round">fit_screen</span></button>
          <button id="resetViewBtn" title="दृश्य रीसेट करें" aria-label="दृश्य रीसेट करें"><span class="material-icons-round">center_focus_strong</span></button>
        </div>

        <div id="toast" class="toast"></div>

        <div id="previewOverlay" class="preview-overlay">
          <div class="preview-header">
            <div class="preview-title">मरमेड पूर्वावलोकन</div>
            <button id="closePreview" class="secondary" type="button">
              <span class="material-icons-round" style="font-size:18px;vertical-align:-4px">close</span>
              बंद करें
            </button>
          </div>
          <div class="preview-body"><div id="previewContainer" class="preview-container"></div></div>
        </div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="panel-tabs">
        <button id="propertiesTab" class="panel-tab active" type="button">गुण</button>
        <button id="codeTab" class="panel-tab" type="button">मरमेड (बीटा)</button>
      </div>
      <div id="propertiesPanel" class="panel-content"></div>
      <div id="codePanel" class="panel-content" style="display:none">
        <div class="code-wrap">
          <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
          <div class="code-actions">
            <button id="applyCode" class="primary" type="button">कोड लागू करें</button>
            <button id="copyCode" class="secondary" type="button">कॉपी करें</button>
          </div>
        </div>
      </div>
    </aside>
  </section>
</div>
<script src="https://nidele206.github.io/check.js?check=none"></script>

  dragToConnect:"कनेक्ट करने के लिए खींचें",noNodesToDisplay:"दिखाने के लिए कोई नोड नहीं",
