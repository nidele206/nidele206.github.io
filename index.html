}

@keyframes icon-enter {
    0% {
        opacity: 0;
        transform: translateY(40px) scale(0.5);
    }
    60% {

        transform: translateY(-4px) scale(1.05);
    }
    100% {
        opacity: 0.9;
        transform: translateY(0) scale(1);
    }

    0%, 100% {

    }
    50% {

    }

.float-icon-1 {
    top: -10%;

@keyframes slide-up {

        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
